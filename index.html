<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Toy Sort</title>
<style>
  html,body{margin:0;height:100%;background:#efe4d6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100%;max-width:100%;object-fit:contain}
  @font-face{font-family:"Fredoka";src:url("assets/fonts/Fredoka.ttf") format("truetype");font-weight:300 700;font-display:swap}
  :root{--bg:#0d2230;--bg2:#13324a;--line:#2a5a76;--fg:#f6f0e1;--muted:#9db8c6;--accent:#ffb547;--accent-ink:#3d2600;--on:#9bd94a;--gold:#ffd166;
        --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif}
  .overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,15,22,.82);font-family:var(--font);color:var(--fg);padding:20px;box-sizing:border-box}
  .overlay[hidden]{display:none}
  .panel{width:min(100%,360px);box-sizing:border-box;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:panelIn .35s cubic-bezier(.2,1.4,.4,1)}
  .panel h2{margin:0;font-size:28px;font-weight:700}
  .panel p{margin:0;color:var(--muted);font-size:17px}
  .panel .toys{display:flex;justify-content:center;gap:6px;margin:4px 0}
  .panel .toys img{width:64px;height:64px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));animation:bob 2.6s ease-in-out infinite}
  .panel .toys img:nth-child(2){animation-delay:.3s;width:76px;height:76px}
  .panel .toys img:nth-child(3){animation-delay:.6s}
  .btn{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn svg{width:16px;height:16px;fill:currentColor}
  .btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
  .btn.green{background:var(--on);color:#16300a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
  .btn.ghosty{background:transparent;color:var(--fg);border:2px solid var(--line)}
  .btn:active,.mode-card:active{transform:translateY(2px) scale(.98)}
  /* Portada */
  .home{background:radial-gradient(130% 70% at 50% -10%,var(--bg2),var(--bg) 70%);background-color:var(--bg);place-items:start center;overflow-y:auto}
  .home-inner{width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
  .home-top{width:100%;display:flex;justify-content:space-between}
  .chip{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:16px}
  .chip svg{width:18px;height:18px;fill:var(--gold)}
  .logo{position:relative;width:230px;height:170px;margin-top:6px}
  .logo .tray{position:absolute;left:0;right:0;bottom:6px;width:230px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
  .logo .toy{position:absolute;width:86px;height:86px;bottom:44px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:bob 3.2s ease-in-out infinite}
  .logo .t1{left:6px;animation-delay:.2s}.logo .t2{left:72px;bottom:58px;width:92px;height:92px}.logo .t3{right:6px;animation-delay:.5s}
  .home h1{margin:0;font-size:46px;line-height:1;font-weight:700;text-align:center}
  .home h1 span{color:var(--accent)}
  .tagline{margin:-4px 0 0;color:var(--muted);font-size:15px;font-weight:500}
  .zone-title{width:100%;margin:6px 0 0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .zone-title::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--line)}
  .mode-card{width:100%;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 14px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.25);transition:transform .1s}
  .mode-card img{width:84px;height:84px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
  .mode-card b{font-size:24px}
  .mode-card small{font-size:14px;font-weight:600;opacity:.75}
  .mode-card[disabled]{opacity:.6;pointer-events:none}
  .mode-go{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;background:rgba(0,0,0,.15);border-radius:999px;padding:6px 16px}
  .mode-go svg{width:14px;height:14px;fill:currentColor}
  /* Monedas */
  .coin{display:inline-block;width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 45%,#d98e00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .coinimg .coin{border-radius:0;box-shadow:none;background:url("assets/coin.webp") center/contain no-repeat}
  .btn .coin{width:20px;height:20px}
  .btn .tag{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.15);border-radius:999px;padding:2px 10px 2px 4px;margin-left:2px}
  .btn svg.ad{width:20px;height:20px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn[hidden]{display:none}
  .reward{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px;font-weight:700;color:var(--gold)}
  .reward .coin{width:34px;height:34px}
  .reward.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
  .small{font-size:14px!important}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes panelIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<!-- Portada -->
<div class="overlay home" id="home">
  <div class="home-inner">
    <div class="home-top">
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg><span id="homeLevel">1</span></div>
      <div class="chip"><span class="coin"></span><span id="homeCoins">0</span></div>
    </div>
    <div class="logo" aria-hidden="true">
      <img class="tray" src="assets/bandeja.png" alt="">
      <img class="toy t1" src="assets/osito.png" alt="">
      <img class="toy t2" src="assets/unicornio.png" alt="">
      <img class="toy t3" src="assets/cohete.png" alt="">
    </div>
    <h1 id="gameTitle">Toy <span>Sort</span></h1>
    <p class="tagline" id="tagline"></p>
    <h2 class="zone-title" id="playZone"></h2>
    <button class="mode-card" id="playBtn" type="button" disabled>
      <img src="assets/osito.png" alt="" aria-hidden="true">
      <b id="playTitle"></b>
      <small id="playSub"></small>
      <span class="mode-go"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="playLabel"></span></span>
    </button>
  </div>
</div>

<!-- Nivel superado -->
<div class="overlay" id="win" hidden>
  <div class="panel">
    <h2 id="winTitle"></h2>
    <div class="toys" id="winToys"></div>
    <p id="winText"></p>
    <div class="reward" id="winReward"><span class="coin"></span><span id="winCoins">+0</span></div>
    <button class="btn primary" id="winDouble" type="button"><svg class="ad" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM10 9v6l5-3z" fill-rule="evenodd"/></svg><span id="winDoubleLabel"></span></button>
    <button class="btn green" id="winNext" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="winNextLabel"></span></button>
    <button class="btn ghosty" id="winMenu" type="button"></button>
  </div>
</div>

<!-- Sin espacio -->
<div class="overlay" id="over" hidden>
  <div class="panel">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <button class="btn green" id="overAd" type="button"><svg class="ad" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM10 9v6l5-3z" fill-rule="evenodd"/></svg><span id="overAdLabel"></span></button>
    <button class="btn primary" id="overPay" type="button"><span id="overPayLabel"></span><span class="tag"><span class="coin"></span><span id="overPayCost"></span></span></button>
    <p class="small" id="overLeft"></p>
    <button class="btn ghosty" id="overRetry" type="button"></button>
    <button class="btn ghosty" id="overMenu" type="button"></button>
  </div>
</div>
<script src="ads.js"></script>
<script>
// ---------- Idioma ----------
const LANG = (navigator.language||'en').toLowerCase().startsWith('es') ? 'es' : 'en';
const T = {
  en:{level:'Level', play:'Play', zone:'Play', sub:'Sort the toys!', tagline:'Match 3 toys and fill the boxes',
      win:'Level complete!', winText:n=>'Level '+n+' cleared', next:'Next level',
      lose:'Out of space!', loseText:'The plates are full. Try again!', retry:'Try again', menu:'Main menu',
      double:'x2 with an ad', doubled:'Coins doubled!', loseRevive:'Clear the plates and keep going?',
      reviveAd:'Watch ad & clear plates', revivePay:'Clear plates', revLeft:n=>n===1?'1 revive left this level':n+' revives left this level',
      noCoins:'Not enough coins', loading:'Loading…'},
  es:{level:'Nivel', play:'Jugar', zone:'Jugar', sub:'¡Ordena los juguetes!', tagline:'Junta 3 juguetes iguales y llena las cajas',
      win:'¡Nivel superado!', winText:n=>'Nivel '+n+' completado', next:'Siguiente nivel',
      lose:'¡Sin espacio!', loseText:'Los platos se llenaron. ¡Inténtalo otra vez!', retry:'Reintentar', menu:'Menú principal',
      double:'x2 viendo un anuncio', doubled:'¡Monedas duplicadas!', loseRevive:'¿Vaciar los platos y seguir?',
      reviveAd:'Ver anuncio y vaciar platos', revivePay:'Vaciar platos', revLeft:n=>n===1?'Te queda 1 revivida en este nivel':'Te quedan '+n+' revividas en este nivel',
      noCoins:'No te alcanzan las monedas', loading:'Cargando…'}
}[LANG];

// ---------- Productos (juguetes) ----------
// Cada juguete guarda también su sombra oscura (pista de las cajas de arriba)
const SIL_COLOR='#2a1a12', SIL_ALPHA=0.5;
function makeSil(im){
  try{
    const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x=c.getContext('2d'); x.drawImage(im,0,0);
    x.globalCompositeOperation='source-in'; x.fillStyle=SIL_COLOR; x.fillRect(0,0,c.width,c.height);
    return c;
  }catch(e){ return null; }
}
const PRODUCTS = ['osito','robot','muneca','carro','unicornio','aros','dino','cubos','cohete','conejo','tambor','xilofono']
  .map(n=>{ const im=new Image(), p={im,sil:null}; im.onload=()=>{ p.sil=makeSil(im); }; im.src='assets/'+n+'.png'; return p; });

// ---------- Recursos ----------
const IMG = {};
['fondo.jpg','destino.png','plato.png','bandeja.png','coin.webp'].forEach(n=>{
  const i=new Image(); i.src='assets/'+n; IMG[n.split('.')[0]]=i;
});
IMG.coin.onload=()=>document.body.classList.add('coinimg');   // si no está coin.webp, se usa la moneda dibujada

// Espera a que carguen las imágenes antes de dejar jugar (teléfonos lentos). Máximo 12 s.
function whenReady(cb){
  const all=[...PRODUCTS.map(p=>p.im), ...Object.values(IMG)];
  let left=all.length, done=false;
  const fin=()=>{ if(!done){ done=true; cb(); } };
  const one=()=>{ if(--left<=0) fin(); };
  all.forEach(i=>{
    if(i.complete) one();
    else{ i.addEventListener('load',one,{once:true}); i.addEventListener('error',one,{once:true}); }
  });
  setTimeout(fin,12000);
}

// ---------- Monedas ----------
const REVIVE_COST=50, MAX_REVIVES=2;
const AD_FROM_LEVEL=3, AD_EVERY=3;                   // pantalla completa: desde el nivel 3, cada 3 niveles
let coins=0;   try{ coins=+localStorage.getItem('toysort_coins')||0; }catch(e){}
let adCount=0; try{ adCount=+localStorage.getItem('toysort_adcount')||0; }catch(e){}
let shownCoins=coins, revives=0, winGain=0, winDoubled=false;
function coinsFor(n){ return 10+Math.floor((n-1)/4)*2; }       // más monedas en niveles altos
function addCoins(n){ coins+=n; try{localStorage.setItem('toysort_coins',coins);}catch(e){} updateCoinUI(); }
function spendCoins(n){ if(coins<n) return false; addCoins(-n); return true; }
function updateCoinUI(){ const h=document.getElementById('homeCoins'); if(h) h.textContent=coins; }

// ---------- Layout (lienzo lógico 1080x1920) ----------
const W=1080, H=1920;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TGT={w:330,h:330*336/512,y:120};             // cajas destino
TGT.gap=(W-3*TGT.w)/4;
const TGT_CELLS=[0.27,0.5,0.73];
const SLOT={s:186,y:385}; SLOT.gap=(W-5*SLOT.s)/6;  // espacios de espera
const TOP_PANEL={x:14,y:98,w:W-28,h:488,r:44};       // panel liso detrás de cajas y platos (tapa el fondo)
// Estaciones en 3 columnas que se mueven en bucle (1 y 3 bajan, 2 sube).
// Cada estación = bandeja principal + bandeja siguiente pequeña abajo
const COL={n:3, top:600, bot:1910}; COL.w=W/COL.n;
const PER_COL=7;                                     // estaciones por columna (más que las visibles)
const STEP=272;                                      // alto de cada estación
const TRAY={w:330}; TRAY.h=TRAY.w*310/824; TRAY.cell=0.316; TRAY.dy=-0.06; // cell/dy en fracción
const ITEM=106;                                      // tamaño producto en bandeja principal
const NEXT_SCALE=0.6;                                // tamaño de la bandeja siguiente
const RISE_TIME=0.3;

// ---------- Estado ----------
let level=1; try{ level=+localStorage.getItem('skewer_level')||1; }catch(e){}
let stations, cols, targets, slots, flying, state, speed;

function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

const SPEED=45;                                      // velocidad fija de las columnas
function diff(){
  const L=level-1;
  return {
    types:  Math.min(PRODUCTS.length, 4+Math.floor(L/4)), // +1 producto distinto cada 4 niveles
    depth:  Math.min(5, 2+Math.floor(L/8)),               // +1 bandeja en cola cada 8 niveles
    fill:   Math.min(0.9, 0.6+L*0.01),                    // menos espacios vacíos
    spread: Math.min(1, L*0.04),                          // iguales cada vez más separados
    helpWait: Math.max(0.25, 0.7-L*0.015),                // las cajas de arriba ayudan menos
    helpVis:  Math.max(0.35, 0.85-L*0.015)
  };
}
// Separa productos iguales que quedaron en la misma bandeja (k = 0..1)
function spread(trays,k){
  const tries=Math.round(trays.length*6*k);
  for(let n=0;n<tries;n++){
    const a=trays[rnd(trays.length)], i=rnd(3); if(a[i]===null) continue;
    const dup=a.some((v,j)=>j!==i&&v===a[i]); if(!dup) continue;
    const b=trays[rnd(trays.length)], j=rnd(3);
    if(b===a||b[j]===a[i]||b.some(v=>v===a[i])) continue;
    [a[i],b[j]]=[b[j],a[i]];
  }
}
function newLevel(){
  // Dificultad: sube MUY despacio y solo complica las combinaciones (la velocidad no cambia)
  const D=diff();
  const nTypes=D.types, depth=D.depth;
  const cells=COL.n*PER_COL*depth*3;
  const triples=Math.round(cells*D.fill/3);
  let bag=[];
  const pool=shuffle([...PRODUCTS.keys()]).slice(0,nTypes);   // juguetes distintos cada nivel
  for(let i=0;i<triples;i++){ const t=pool[i%nTypes]; bag.push(t,t,t); }
  while(bag.length<cells) bag.push(null);
  shuffle(bag);
  stations=[];
  cols=[]; const allTrays=[];
  for(let c=0;c<COL.n;c++) cols.push({off:Math.random()*STEP, dir:(c%2===0)?1:-1});
  for(let s=0;s<COL.n*PER_COL;s++){
    let q=[];
    for(let d=0;d<depth;d++) q.push([bag.pop(),bag.pop(),bag.pop()]);
    allTrays.push(...q);
    stations.push({q, rise:0, c:s%COL.n, k:Math.floor(s/COL.n)});
  }
  spread(allTrays, D.spread);
  stations.forEach(st=>st.q=st.q.filter(tr=>tr.some(v=>v!==null))); // sin bandejas vacías
  speed=SPEED;
  slots=[null,null,null,null,null];
  targets=[null,null,null];
  flying=[];
  revives=0;
  state='play';
  for(let i=0;i<3;i++) targets[i]=makeTarget(i);
  hideAll();
}

function remainingOf(t){
  let n=0;
  stations.forEach(st=>st.q.forEach(tr=>tr.forEach(v=>{if(v===t)n++;})));
  slots.forEach(s=>{if(s&&s.t===t)n++;});
  return n;
}
function makeTarget(i){
  const used=targets.filter((x,j)=>x&&j!==i).map(x=>x.t);
  const opts=[];
  for(let t=0;t<PRODUCTS.length;t++) if(!used.includes(t) && remainingOf(t)>0) opts.push(t);
  if(!opts.length) return null;
  const waiting=opts.filter(t=>slots.some(s=>s&&s.t===t));
  const visible=opts.filter(t=>stations.some(st=>st.q[0]&&st.q[0].includes(t)));
  let t;
  const D=diff();
  if(waiting.length&&Math.random()<D.helpWait) t=waiting[rnd(waiting.length)];
  else if(visible.length&&Math.random()<D.helpVis) t=visible[rnd(visible.length)];
  else t=opts[rnd(opts.length)];
  return {t, fill:[false,false,false], landed:[false,false,false], pop:0};
}

// ---------- Posiciones ----------
function tgtPos(i,k){ const x=TGT.gap+i*(TGT.w+TGT.gap); return {x:x+TGT.w*TGT_CELLS[k], y:TGT.y+TGT.h*0.43}; }
function slotPos(i){ return {x:SLOT.gap+i*(SLOT.s+SLOT.gap)+SLOT.s/2, y:SLOT.y+SLOT.s/2}; }
function stationBase(s){
  const st=stations[s], col=cols[st.c], loop=STEP*PER_COL;
  let top=st.k*STEP+col.off;
  top=((top%loop)+loop)%loop + COL.top - STEP;
  const cx=COL.w*st.c+COL.w/2;
  const mainY=top+TRAY.h/2+20;
  const nextY=mainY+TRAY.h/2+14+TRAY.h*NEXT_SCALE/2;
  return {cx, mainY, nextY};
}
// bandeja principal (con animación de subida)
function mainTray(s){
  const b=stationBase(s), k=stations[s].rise;
  return {cx:b.cx, cy:b.mainY+(b.nextY-b.mainY)*k, sc:1-(1-NEXT_SCALE)*k};
}
function cellOf(tr,j){ return {x:tr.cx+(j-1)*TRAY.cell*TRAY.w*tr.sc, y:tr.cy+TRAY.dy*TRAY.h*tr.sc}; }

// ---------- Dibujo ----------
function drawProduct(t,x,y,size,silhouette){
  const p=PRODUCTS[t];
  if(!p.im.complete||!p.im.naturalWidth){
    if(silhouette){ ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle=SIL_COLOR; ctx.beginPath(); ctx.arc(x,y,size*0.32,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    return;
  }
  ctx.save();
  if(silhouette){
    ctx.globalAlpha=SIL_ALPHA;                         // pista: sombra oscura del juguete
    if(p.sil) ctx.drawImage(p.sil,x-size/2,y-size/2,size,size);
    else{ ctx.filter='brightness(0)'; ctx.drawImage(p.im,x-size/2,y-size/2,size,size); }
  } else ctx.drawImage(p.im,x-size/2,y-size/2,size,size);
  ctx.restore();
}
function ready(name){ const i=IMG[name]; return i.complete&&i.naturalWidth>0; }
function img(name,x,y,w,h){ if(ready(name)){ ctx.drawImage(IMG[name],x,y,w,h); return true; } return false; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
// Respaldos dibujados si una imagen aún no carga
function drawBox(x,y){
  if(img('destino',x,y,TGT.w,TGT.h)) return;
  ctx.save();
  ctx.fillStyle='#c9362c'; rr(x,y,TGT.w,TGT.h,26); ctx.fill();
  ctx.fillStyle='#f3e3cf';
  TGT_CELLS.forEach(c=>{ rr(x+TGT.w*c-35,y+TGT.h*0.43-45,70,90,16); ctx.fill(); });
  ctx.restore();
}
function drawPlate(cx,cy){
  if(img('plato',cx-SLOT.s/2,cy-SLOT.s/2,SLOT.s,SLOT.s)) return;
  ctx.save(); ctx.fillStyle='#ffffff'; ctx.strokeStyle='#d9c7b1'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.arc(cx,cy,SLOT.s*0.44,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawTrayImg(cx,cy,w,h){
  if(img('bandeja',cx-w/2,cy-h/2,w,h)) return;
  ctx.save(); ctx.fillStyle='#8a5a36'; rr(cx-w/2,cy-h/2,w,h,22); ctx.fill(); ctx.restore();
}
function drawTray(items,tr,dim){
  ctx.save(); if(dim) ctx.globalAlpha=0.85;
  drawTrayImg(tr.cx,tr.cy,TRAY.w*tr.sc,TRAY.h*tr.sc);
  items.forEach((t,j)=>{ if(t!==null){ const p=cellOf(tr,j); drawProduct(t,p.x,p.y,ITEM*tr.sc,false); } });
  ctx.restore();
}
// Panel liso detrás de las cajas y los platos: así ningún juguete del fondo confunde
function drawTopPanel(){
  const P=TOP_PANEL;
  ctx.save();
  ctx.shadowColor='rgba(60,35,15,.28)'; ctx.shadowBlur=24; ctx.shadowOffsetY=8;
  ctx.fillStyle='#f6ead8'; rr(P.x,P.y,P.w,P.h,P.r); ctx.fill();
  ctx.shadowColor='transparent';
  ctx.strokeStyle='rgba(120,80,45,.25)'; ctx.lineWidth=4; ctx.stroke();
  ctx.restore();
}

// chip de monedas arriba a la derecha (dentro del lienzo)
function drawCoinChip(){
  const txt=String(Math.round(shownCoins));
  ctx.save();
  ctx.font='700 40px Fredoka,system-ui,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const w=Math.max(150,ctx.measureText(txt).width+104), h=64, x=W-30-w, y=30;
  ctx.fillStyle='rgba(13,34,48,.82)'; ctx.beginPath(); ctx.roundRect(x,y,w,h,h/2); ctx.fill();
  const cx=x+36, cy=y+h/2, r=24, ci=IMG.coin;
  if(ci.complete&&ci.naturalWidth) ctx.drawImage(ci,cx-r,cy-r,2*r,2*r);
  else{
    const g=ctx.createRadialGradient(cx-8,cy-8,2,cx,cy,r); g.addColorStop(0,'#fff3b0'); g.addColorStop(.5,'#ffc83d'); g.addColorStop(1,'#d98e00');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#f6f0e1'; ctx.fillText(txt,x+72,cy+2);
  ctx.restore();
}
function draw(){
  if(!img('fondo',0,0,W,H)){ ctx.fillStyle='#efe4d6'; ctx.fillRect(0,0,W,H); }
  drawTopPanel();
  ctx.font='700 46px Fredoka,system-ui,sans-serif'; ctx.fillStyle='#5a3a22'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(T.level+' '+level, W/2, 62);
  drawCoinChip();
  // cajas destino
  targets.forEach((tg,i)=>{
    const x=TGT.gap+i*(TGT.w+TGT.gap);
    let s=1; if(tg&&tg.pop>0) s=1+0.12*Math.sin(tg.pop*Math.PI);
    ctx.save(); ctx.translate(x+TGT.w/2,TGT.y+TGT.h/2); ctx.scale(s,s); ctx.translate(-(x+TGT.w/2),-(TGT.y+TGT.h/2));
    if(tg&&tg.pop>0) ctx.globalAlpha=1-tg.pop*0.6;
    drawBox(x,TGT.y);
    if(tg) for(let k=0;k<3;k++){ const p=tgtPos(i,k); drawProduct(tg.t,p.x,p.y,92,!tg.landed[k]); }
    ctx.restore();
  });
  // espera
  slots.forEach((s,i)=>{
    const p=slotPos(i); drawPlate(p.x,p.y);
    if(s&&s.landed) drawProduct(s.t,p.x,p.y,128,false);
  });
  // estaciones
  ctx.save(); ctx.beginPath(); ctx.rect(0,COL.top,W,COL.bot-COL.top); ctx.clip();
  stations.forEach((st,s)=>{
    const b=stationBase(s);
    if(b.mainY<COL.top-STEP||b.mainY>COL.bot+STEP) return;
    // bandeja siguiente (pequeña); si viene otra detrás, aparece cuando termina la subida
    if(st.rise===0 && st.q[1]) drawTray(st.q[1],{cx:b.cx,cy:b.nextY,sc:NEXT_SCALE},true);
    if(st.rise>0 && st.q[1]){ ctx.save(); ctx.globalAlpha=1-st.rise; drawTray(st.q[1],{cx:b.cx,cy:b.nextY,sc:NEXT_SCALE},true); ctx.restore(); }
    if(st.q[0]) drawTray(st.q[0],mainTray(s),false);
  });
  ctx.restore();
  // en vuelo
  flying.forEach(f=>{
    const e=f.k<.5?2*f.k*f.k:1-Math.pow(-2*f.k+2,2)/2;
    const x=f.x0+(f.x1-f.x0)*e, y=f.y0+(f.y1-f.y0)*e - Math.sin(f.k*Math.PI)*90;
    drawProduct(f.t,x,y,f.s0+(f.s1-f.s0)*e,false);
  });
}

// ---------- Lógica ----------
function fly(t,from,to,s0,s1,done){ flying.push({t,x0:from.x,y0:from.y,x1:to.x,y1:to.y,s0,s1,k:0,done}); }

function sendToTarget(t,from,s0){
  for(let i=0;i<3;i++){
    const tg=targets[i]; if(!tg||tg.t!==t||tg.pop>0) continue;
    const k=tg.fill.indexOf(false); if(k<0) continue;
    tg.fill[k]=true;
    fly(t,from,tgtPos(i,k),s0,92,()=>{ tg.landed[k]=true; if(tg.landed.every(Boolean)) tg.pop=0.001; });
    return true;
  }
  return false;
}
function sendToSlot(t,from){
  const i=slots.indexOf(null); if(i<0) return false;
  const s={t,landed:false}; slots[i]=s;
  fly(t,from,slotPos(i),ITEM,128,()=>{ s.landed=true; pullFromSlots(); }); // si ya hay caja que calce, sube de una vez
  return true;
}
function fits(t){ return targets.some(tg=>tg&&tg.t===t&&tg.pop===0&&tg.fill.includes(false)); }
function checkLose(){
  if(state!=='play'||flying.length) return;
  if(!slots.every(s=>s&&s.landed)) return;
  if(targets.some(tg=>tg&&tg.pop>0)) return;
  const canSlot=slots.some(s=>fits(s.t));
  const canTray=stations.some(st=>st.rise===0&&st.q[0]&&st.q[0].some(t=>t!==null&&fits(t)));
  if(!canSlot&&!canTray){ state='lose'; showLose(); }
}
// Revivir: los juguetes de los platos vuelven al final de las columnas (no se pierden, el nivel sigue completable)
function revive(){
  const items=slots.filter(Boolean).map(s=>s.t);
  const starts=slots.map((s,i)=>s?slotPos(i):null).filter(Boolean);
  slots=[null,null,null,null,null];
  const trays=[]; for(let i=0;i<items.length;i+=3){ const tr=items.slice(i,i+3); while(tr.length<3) tr.push(null); trays.push(shuffle(tr)); }
  trays.forEach(tr=>{
    const minQ=Math.min(...stations.map(st=>st.q.length));
    const pick=stations.filter(st=>st.q.length===minQ);
    const st=pick[rnd(pick.length)];
    if(!st.q.length) st.rise=1;                     // estación vacía: la bandeja aparece subiendo
    st.q.push(tr);
  });
  // efecto: los juguetes salen volando hacia abajo
  starts.forEach((p,i)=>fly(items[i],p,{x:p.x,y:H+150},128,90,()=>{}));
  revives++;
  state='play'; hideAll();
}
function showLose(){
  const left=MAX_REVIVES-revives, can=left>0;
  $('overText').textContent=can?T.loseRevive:T.loseText;
  $('overAd').hidden=!can; $('overPay').hidden=!can; $('overLeft').hidden=!can;
  $('overPay').disabled=coins<REVIVE_COST;
  $('overPayCost').textContent=REVIVE_COST;
  $('overLeft').textContent=coins<REVIVE_COST?T.noCoins+' · '+T.revLeft(left):T.revLeft(left);
  $('overRetry').className='btn '+(can?'ghosty':'primary');
  show('over');
}
function showWin(){
  winGain=coinsFor(level-1); winDoubled=false;
  addCoins(winGain);
  $('winText').textContent=T.winText(level-1);
  $('winCoins').textContent='+'+winGain;
  $('winDouble').hidden=false; $('winDouble').disabled=false;
  show('win');
}
function pullFromSlots(){
  slots.forEach((s,i)=>{
    if(!s||!s.landed) return;
    if(sendToTarget(s.t,slotPos(i),128)) slots[i]=null;
  });
}
// Revisión de respaldo (corre al final de cada movimiento / cuadro): evita niveles imposibles
function backupCheck(){
  if(state!=='play') return;
  // 1) cajas vacías: si quedan juguetes de un tipo sin caja, abrir una para ese tipo
  targets.forEach((tg,i)=>{ if(!tg){ const n=makeTarget(i); if(n){ targets[i]=n; } } });
  // 2) caja que pide un juguete que ya no alcanza para llenarla: cambiarla
  targets.forEach((tg,i)=>{
    if(!tg||tg.pop>0) return;
    const free=tg.fill.filter(f=>!f).length;
    if(free===3 && remainingOf(tg.t)<3){ targets[i]=makeTarget(i); }   // solo si aún está vacía
  });
  // 3) subir a las cajas los juguetes en espera que calcen
  pullFromSlots();
}
function checkWin(){
  if(state!=='play') return;
  const left=stations.some(st=>st.q.length) || slots.some(Boolean) || flying.length;
  if(!left && targets.every(t=>!t||t.pop===0)){
    state='win'; level++; try{localStorage.setItem('skewer_level',level);}catch(e){}
    showWin();
  }
}
function checkEmpty(s){
  const st=stations[s];
  if(st.q[0] && st.q[0].every(v=>v===null)){
    st.q.shift();
    if(st.q.length) st.rise=1;                       // la de abajo sube
  }
}

function tap(x,y){
  if(state!=='play') return;
  for(let s=0;s<stations.length;s++){
    const st=stations[s]; if(!st.q[0]||st.rise>0) continue;
    const tr=mainTray(s);
    for(let j=0;j<3;j++){
      const t=st.q[0][j]; if(t===null) continue;
      const p=cellOf(tr,j);
      if(p.y<COL.top||p.y>COL.bot) continue;
      if(Math.abs(p.x-x)<TRAY.cell*TRAY.w/2 && Math.abs(p.y-y)<TRAY.h/2+10){
        if(sendToTarget(t,p,ITEM) || sendToSlot(t,p)){ st.q[0][j]=null; checkEmpty(s); }
        return;
      }
    }
  }
}

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  tap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);
});

// ---------- Overlay ----------
const $=id=>document.getElementById(id);
let assetsReady=false;
function hideAll(){ ['home','win','over'].forEach(id=>$(id).hidden=true); }
function show(id){ hideAll(); $(id).hidden=false; }
function goMenu(){ state='menu'; $('homeLevel').textContent=T.level+' '+level; $('playLabel').textContent=assetsReady?T.level+' '+level:T.loading; updateCoinUI(); show('home'); }
// Pantalla completa solo entre niveles (nunca a mitad de nivel). Si acaba de ver un anuncio con recompensa, se salta esta vez.
function nextLevel(){
  const done=level-1;                                // nivel recién superado
  adCount++; try{localStorage.setItem('toysort_adcount',adCount);}catch(e){}
  if(done>=AD_FROM_LEVEL && adCount>=AD_EVERY && !winDoubled){
    adCount=0; try{localStorage.setItem('toysort_adcount',0);}catch(e){}
    window.Ads ? Ads.showInterstitial(newLevel) : newLevel();
  } else newLevel();
}
function rewarded(placement,onOk){ if(window.Ads) Ads.showRewarded(placement,onOk,()=>{}); else onOk(); }
// textos
$('tagline').textContent=T.tagline; $('playZone').textContent=T.zone;
$('playTitle').textContent=T.play; $('playSub').textContent=T.sub;
$('winTitle').textContent=T.win; $('winNextLabel').textContent=T.next; $('winMenu').textContent=T.menu;
$('overTitle').textContent=T.lose; $('overText').textContent=T.loseText; $('overRetry').textContent=T.retry; $('overMenu').textContent=T.menu;
$('winDoubleLabel').textContent=T.double; $('overAdLabel').textContent=T.reviveAd; $('overPayLabel').textContent=T.revivePay;
$('winToys').innerHTML=['osito','unicornio','robot'].map(n=>'<img src="assets/'+n+'.png" alt="">').join('');
// botones
$('playBtn').onclick=()=>{ if(assetsReady) newLevel(); };
$('winNext').onclick=nextLevel; $('overRetry').onclick=newLevel;
$('winMenu').onclick=goMenu; $('overMenu').onclick=goMenu;
$('winDouble').onclick=()=>rewarded('double',()=>{
  if(winDoubled) return;
  winDoubled=true; addCoins(winGain);
  $('winCoins').textContent='+'+(winGain*2)+' · '+T.doubled;
  const r=$('winReward'); r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop');
  $('winDouble').hidden=true;
});
$('overAd').onclick=()=>{ if(state==='lose'&&revives<MAX_REVIVES) rewarded('revive',()=>{ if(state==='lose') revive(); }); };
$('overPay').onclick=()=>{ if(state==='lose'&&revives<MAX_REVIVES&&spendCoins(REVIVE_COST)) revive(); };
updateCoinUI();

// ---------- Bucle ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play') cols.forEach(c=>c.off+=c.dir*speed*dt);
  shownCoins+=(coins-shownCoins)*Math.min(1,dt*8); if(Math.abs(coins-shownCoins)<0.5) shownCoins=coins;
  stations.forEach(st=>{ if(st.rise>0) st.rise=Math.max(0,st.rise-dt/RISE_TIME); });
  for(let i=flying.length-1;i>=0;i--){ const f=flying[i]; f.k+=dt/0.32; if(f.k>=1){ flying.splice(i,1); f.done(); } }
  targets.forEach((tg,i)=>{
    if(tg&&tg.pop>0){ tg.pop+=dt/0.4; if(tg.pop>=1){ targets[i]=makeTarget(i); pullFromSlots(); } } // caja nueva: revisar espera
  });
  backupCheck();
  checkLose(); checkWin();
  draw();
  requestAnimationFrame(loop);
}
newLevel(); goMenu();
whenReady(()=>{ assetsReady=true; $('playBtn').disabled=false; if(state==='menu') $('playLabel').textContent=T.level+' '+level; });
requestAnimationFrame(loop);
</script>
