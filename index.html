<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f9a9b8">
<title>Toy Sort</title>
<!-- ¿Celular lento (2 GB de RAM o menos)? La presentación de Stera sale quieta, sin animación. -->
<script>
(function(){ try{ var m=navigator.deviceMemory||0; if(m>0&&m<=2) document.documentElement.classList.add('lite'); }catch(e){} })();
</script>
<style>
  @font-face{font-family:"Fredoka";src:url("assets/fonts/Fredoka.ttf") format("truetype"),url("Fredoka.ttf") format("truetype");font-weight:300 700;font-display:swap}
  /* Colores al estilo de Marshmallow Pals (Stera Digital Studios) */
  :root{--pink:#c2185b;--pink-dark:#8e0f42;--pink-soft:#ffe6f0;--pink-line:#f8bbd0;--gold:#ffd166;--on:#2e9d4a;
        --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#e6e0d6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#8f4a24}
  canvas{display:block;height:100%;max-width:100%;object-fit:contain}

  /* ===== Presentación al abrir: "Stera Digital Studios" (igual que Marshmallow Pals) ===== */
  .splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;overflow:hidden;
    background:linear-gradient(180deg,#fde4ec 0%,#f3dcff 50%,#d9f0ff 100%);font-family:var(--font)}
  .splash.leaving{animation:splash-out 300ms ease-in forwards}
  .splash-word{display:flex;margin:0;white-space:nowrap;font-size:clamp(3.6rem,20vw,6rem);font-weight:700;line-height:1;letter-spacing:.02em}
  .splash-word span{display:inline-block;color:var(--c);
    text-shadow:0 3px 0 #fff,0 -2px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 7px 0 rgba(0,0,0,.08),0 10px 18px rgba(142,15,66,.25);
    opacity:0;animation:splash-fade 450ms ease-out calc(var(--i)*70ms) forwards,splash-float 1.8s ease-in-out calc(var(--i)*-360ms) infinite}
  .splash-sub{margin:0;font-size:clamp(.95rem,4.6vw,1.3rem);font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--pink-dark);
    opacity:0;animation:splash-sub 500ms ease-out 350ms forwards}
  .splash-sparkle{position:absolute;color:#fff;font-size:1.6rem;text-shadow:0 0 10px rgba(255,193,7,.9);opacity:0;animation:splash-twinkle 1.1s ease-in-out var(--d) infinite}
  .splash-loading{position:absolute;left:0;right:0;bottom:96px;margin:0;text-align:center;font-size:1.15rem;font-weight:500;color:#6b6080;
    opacity:0;animation:splash-sub 400ms ease-out 500ms forwards}
  @keyframes splash-fade{from{opacity:0}to{opacity:1}}
  @keyframes splash-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes splash-sub{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes splash-twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
  @keyframes splash-out{to{opacity:0;visibility:hidden}}
  html.lite .splash-word span,html.lite .splash-sub,html.lite .splash-loading{animation:none;opacity:1}
  html.lite .splash-word span{text-shadow:0 3px 0 #fff,0 -2px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff}
  html.lite .splash-sparkle{display:none}
  html.lite .splash.leaving{animation-duration:150ms}
  @media (prefers-reduced-motion:reduce){.splash-word span,.splash-sub,.splash-loading{animation:none;opacity:1}.splash-sparkle{display:none}}

  /* ===== Ventanas (nivel superado, sin espacio, pausa, ajustes, créditos) ===== */
  .overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(80,20,45,.45);font-family:var(--font);color:var(--pink-dark);animation:fade-in 250ms ease-out}
  .overlay[hidden]{display:none}
  .panel{width:min(340px,100%);max-height:calc(100% - 8px);overflow-y:auto;padding:22px 20px;text-align:center;background:#fff;border:4px solid var(--pink);
    border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;animation:card-in 400ms cubic-bezier(.34,1.56,.64,1)}
  .panel.won{border-color:#f5b000}
  .panel h2{margin:0 0 2px;font-size:2rem;line-height:1.1;color:var(--pink)}
  .panel p{margin:0;font-size:1.05rem;font-weight:500}
  .panel .toys{display:flex;justify-content:center;gap:6px;margin:2px 0}
  .panel .toys img{width:64px;height:64px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
  .panel .toys img:nth-child(2){animation-delay:.3s;width:76px;height:76px}
  .panel .toys img:nth-child(3){animation-delay:.6s}
  .btn{font:inherit;font-weight:700;font-size:1.05rem;color:var(--pink);background:#fff;border:2px solid var(--pink);border-radius:20px;padding:10px 16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .btn svg{width:16px;height:16px;fill:currentColor}
  .btn:active{background:var(--pink-soft);transform:translateY(1px)}
  .btn.primary{color:#fff;background:var(--pink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
  .btn.green{color:#fff;background:var(--on);border-color:var(--on);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
  .btn.ghosty{color:var(--pink);background:#fff}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn[hidden]{display:none}
  .btn svg.ad{width:20px;height:20px}
  .btn .tag{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.12);border-radius:999px;padding:2px 10px 2px 4px;margin-left:2px}
  .small{font-size:.9rem!important;color:#9a6b80}
  /* Ajustes */
  .settings-list{display:flex;flex-direction:column;gap:8px;width:100%;margin:6px 0 2px}
  .setting-row{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-size:1.05rem;font-weight:600;color:var(--pink-dark);text-align:left;
    background:#fff;border:2px solid var(--pink-line);border-radius:16px;padding:10px 14px;cursor:pointer;transition:transform 100ms,background 150ms}
  .setting-row[hidden]{display:none}
  .setting-row:active{transform:translateY(1px);background:var(--pink-soft)}
  .setting-icon{width:1.6em;font-size:1.25rem;text-align:center}
  .setting-name{flex:1}
  .setting-value{font-weight:700;color:var(--pink)}
  .setting-arrow{font-size:1.5rem;line-height:1;color:var(--pink)}
  .switch{position:relative;flex:none;width:46px;height:26px;border-radius:13px;background:var(--pink);transition:background 200ms}
  .switch::after{content:"";position:absolute;top:3px;left:23px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left 200ms}
  .setting-row.off .switch{background:#cfc3c8}
  .setting-row.off .switch::after{left:3px}
  /* Créditos */
  .credits-game{margin:0!important;font-size:1.7rem!important;font-weight:700!important;line-height:1.1;color:var(--pink)}
  .credits-version{margin:0!important;font-size:.85rem!important;color:#9a6b80}
  .credits-list{margin:4px 0 0}
  .credits-list dt{margin-top:12px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9a6b80}
  .credits-list dd{margin:2px 0 0;font-size:1.05rem;font-weight:700;color:var(--pink-dark)}
  .credits-list .credits-mail{font-size:.95rem;word-break:break-all}
  .credits-copy{margin-top:8px!important;font-size:.75rem!important;color:#9a6b80}

  /* ===== Portada (estilo Marshmallow Pals) ===== */
  .home{background:url("assets/fondo.webp") center/cover no-repeat,linear-gradient(#fbf1e4,#f3e4cf 60%,#d9b483);align-items:flex-start;overflow-y:auto;padding:14px 12px}
  .home-inner{width:min(100%,380px);display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}
  .home-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 12px;font-weight:700;font-size:1.05rem;color:var(--pink-dark);background:#fff4f8;border:2px solid #ffc2d4;border-radius:999px;white-space:nowrap}
  .gear-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;padding:0;background:#fff4f8;border:2px solid #ffc2d4;cursor:pointer}
  .gear-btn:active{transform:translateY(1px)}
  .hero{margin-top:4px;padding:16px 10px 20px;background:rgba(255,255,255,.86);border-radius:28px;box-shadow:0 6px 18px rgba(142,15,66,.12)}
  .logo-toys{display:flex;justify-content:center;gap:2px;margin-bottom:4px}
  .logo-toys img{width:54px;height:54px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.2));animation:toy-hop 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
  .logo{margin:0;font-size:clamp(2.6rem,14vw,3.4rem);font-weight:700;line-height:.95;color:var(--pink);letter-spacing:.02em;
    text-shadow:0 3px 0 #fff,0 5px 0 #f8bbd0,0 8px 14px rgba(194,24,91,.35)}
  .tagline{margin:8px 0 0;color:var(--pink-dark);font-size:.95rem;font-weight:600;opacity:.8}
  .zone-title{margin:4px 0 0;display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.45)}
  .zone-title::after{content:"";flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.7);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .mode-card{position:relative;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 14px;border-radius:20px;border:0;
    background:var(--pink);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.25);transition:transform .1s}
  .mode-card:active{transform:translateY(2px)}
  .mode-card[disabled]{opacity:.6;pointer-events:none}
  .mode-ico{font-size:30px;line-height:1;height:34px;display:grid;place-items:center}
  .mode-card b{font-size:1.4rem}
  .mode-card small{font-size:.9rem;font-weight:600;opacity:.85}
  .mode-go{margin-top:8px;font-size:1rem;font-weight:700;background:rgba(0,0,0,.18);border-radius:999px;padding:4px 16px}
  .home-bar{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;font:inherit;color:var(--pink-dark);text-align:left;
    background:rgba(255,255,255,.92);border:2px solid #ffc2d4;border-radius:18px;box-shadow:0 4px 0 #f3a6c1}
  .home-bar img{width:44px;height:44px;flex:none}
  .bar-txt{display:flex;flex-direction:column;flex:1}
  .bar-txt b{font-size:1.1rem}
  .bar-txt small{font-size:.85rem;opacity:.8}
  .boost-pips{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .boost-pip{font-size:.8rem;font-weight:700;background:var(--pink-soft);border-radius:999px;padding:2px 8px}
  .boost-pip.locked{opacity:.5}
  /* Monedas */
  .coin{display:inline-block;width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 45%,#d98e00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .coinimg .coin{border-radius:0;box-shadow:none;background:url("assets/coin.webp") center/contain no-repeat}
  .btn .coin{width:20px;height:20px}
  .reward{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px;font-weight:700;color:#e09a00}
  .reward .coin{width:34px;height:34px}
  .reward.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes toy-hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(-6px) rotate(4deg)}}
  @keyframes card-in{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<!-- ===== PRESENTACIÓN AL ABRIR (igual que Marshmallow Pals) ===== -->
<div id="splash" class="splash" aria-label="Stera Digital Studios">
  <h1 class="splash-word" aria-hidden="true">
    <span style="--i:0; --c:#e8457a">S</span><span style="--i:1; --c:#f08a24">t</span><span style="--i:2; --c:#3fae5a">e</span><span style="--i:3; --c:#3b8fe0">r</span><span style="--i:4; --c:#9a5ad8">a</span>
  </h1>
  <p class="splash-sub" aria-hidden="true">Digital Studios</p>
  <span class="splash-sparkle" style="top:30%; left:16%; --d:0.6s" aria-hidden="true">✦</span>
  <span class="splash-sparkle" style="top:36%; right:14%; --d:1s" aria-hidden="true">✦</span>
  <span class="splash-sparkle" style="bottom:33%; left:26%; --d:1.3s" aria-hidden="true">✦</span>
  <p id="splashLoading" class="splash-loading">Loading...</p>
</div>
<script>
(function(){
  try{
    var l=localStorage.getItem('toysort_lang') || ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en');
    if(l==='es') document.getElementById('splashLoading').textContent='Cargando...';
  }catch(e){}
  window.__splashStart=Date.now();
})();
</script>

<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>

<!-- ===== PORTADA ===== -->
<div class="overlay home" id="home">
  <div class="home-inner">
    <div class="home-top">
      <div class="chip"><span class="coin"></span><span id="homeCoins">0</span></div>
      <button id="homeSettings" class="gear-btn" type="button" aria-label="Settings"><span aria-hidden="true">⚙️</span></button>
    </div>
    <div class="hero">
      <div class="logo-toys" aria-hidden="true">
        <img style="--i:0" src="assets/osito.png" alt=""><img style="--i:1" src="assets/unicornio.png" alt=""><img style="--i:2" src="assets/cohete.png" alt=""><img style="--i:3" src="assets/dino.png" alt=""><img style="--i:4" src="assets/robot.png" alt="">
      </div>
      <h1 class="logo">Toy Sort</h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <h2 class="zone-title" id="playZone"></h2>
    <button class="mode-card" id="playBtn" type="button" disabled>
      <span class="mode-ico" aria-hidden="true">▶</span>
      <b id="playTitle"></b>
      <small id="playSub"></small>
      <span class="mode-go" id="playLabel"></span>
    </button>
    <h2 class="zone-title" id="boostZone"></h2>
    <div class="home-bar">
      <img src="assets/cubos.png" alt="" aria-hidden="true">
      <span class="bar-txt"><b id="boostTitle"></b><span class="boost-pips" id="boostPips"></span></span>
    </div>
  </div>
</div>

<!-- Nivel superado -->
<div class="overlay" id="win" hidden>
  <div class="panel won">
    <h2 id="winTitle"></h2>
    <div class="toys" id="winToys"></div>
    <p id="winText"></p>
    <div class="reward" id="winReward"><span class="coin"></span><span id="winCoins">+0</span></div>
    <button class="btn green" id="winDouble" type="button"><svg class="ad" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM10 9v6l5-3z" fill-rule="evenodd"/></svg><span id="winDoubleLabel"></span></button>
    <button class="btn primary" id="winNext" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="winNextLabel"></span></button>
    <button class="btn ghosty" id="winMenu" type="button"></button>
  </div>
</div>

<!-- Sin espacio -->
<div class="overlay" id="over" hidden>
  <div class="panel">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <button class="btn green" id="overAd" type="button"><svg class="ad" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM10 9v6l5-3z" fill-rule="evenodd"/></svg><span id="overAdLabel"></span></button>
    <button class="btn primary" id="overPay" type="button"><span id="overPayLabel"></span><span class="tag"><span class="coin"></span><span id="overPayCost"></span></span></button>
    <p class="small" id="overLeft"></p>
    <button class="btn ghosty" id="overRetry" type="button"></button>
    <button class="btn ghosty" id="overMenu" type="button"></button>
  </div>
</div>

<!-- Pausa -->
<div class="overlay" id="pause" hidden>
  <div class="panel">
    <h2 id="pauseTitle"></h2>
    <button class="btn primary" id="pauseGo" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="pauseGoLabel"></span></button>
    <button class="btn ghosty" id="pauseSettings" type="button"></button>
    <button class="btn ghosty" id="pauseRetry" type="button"></button>
    <button class="btn ghosty" id="pauseMenu" type="button"></button>
  </div>
</div>

<!-- Ajustes -->
<div class="overlay" id="settings" hidden>
  <div class="panel">
    <h2 id="settingsTitle"></h2>
    <div class="settings-list">
      <button id="musicToggle" class="setting-row" type="button"><span class="setting-icon" aria-hidden="true">🎵</span><span class="setting-name" id="musicName"></span><span class="switch" aria-hidden="true"></span></button>
      <button id="sfxToggle" class="setting-row" type="button"><span class="setting-icon" aria-hidden="true">🔊</span><span class="setting-name" id="sfxName"></span><span class="switch" aria-hidden="true"></span></button>
      <button id="langToggle" class="setting-row" type="button"><span class="setting-icon" aria-hidden="true">🌐</span><span class="setting-name" id="languageName"></span><span class="setting-value" id="langName"></span></button>
      <button id="privacyBtn" class="setting-row" type="button" hidden><span class="setting-icon" aria-hidden="true">🔒</span><span class="setting-name" id="privacyName"></span><span class="setting-arrow" aria-hidden="true">›</span></button>
      <button id="creditsBtn" class="setting-row" type="button"><span class="setting-icon" aria-hidden="true">⭐</span><span class="setting-name" id="creditsName"></span><span class="setting-arrow" aria-hidden="true">›</span></button>
    </div>
    <button id="settingsClose" class="btn" type="button" style="align-self:center;padding:8px 24px"></button>
  </div>
</div>

<!-- Créditos -->
<div class="overlay" id="credits" hidden>
  <div class="panel">
    <h2 id="creditsTitle"></h2>

    <dl class="credits-list">
      <dt id="cMadeBy"></dt><dd>Stera Digital Studios</dd>
      <dt id="cDev"></dt><dd>Stera Digital Studios</dd>

      <dt id="cSfx"></dt><dd>Stera Digital Studios</dd>
      <dt id="cFont"></dt><dd><button type="button" class="license-link" data-license="fredoka">Fredoka · SIL Open Font License</button></dd>

      <dt id="cContact"></dt><dd class="credits-mail">steradigitalstudios@gmail.com</dd>

    <button id="creditsClose" class="btn" type="button" style="align-self:center;padding:8px 24px"></button>

</div>

function tinted(im,mode){
  try{
    const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x=c.getContext('2d');
    if(mode==='ghost'){ x.filter='grayscale(1) brightness(1.2)'; x.drawImage(im,0,0); x.filter='none'; }
    else{ x.drawImage(im,0,0); x.globalCompositeOperation='source-atop'; x.fillStyle='rgba(40,25,16,.74)'; x.fillRect(0,0,c.width,c.height); }
    return c;
  }catch(e){ return null; }
}

// Espera a que carguen las imágenes antes de dejar jugar (teléfonos lentos). Máximo 12 s.
function whenReady(cb){
  const all=[...PRODUCTS.map(p=>p.im), ...Object.values(IMG)];
  let left=all.length, done=false;
  const fin=()=>{ if(!done){ done=true; cb(); } };
  const one=()=>{ if(--left<=0) fin(); };
  all.forEach(i=>{
    if(i.complete) one();
    else{ i.addEventListener('load',one,{once:true}); i.addEventListener('error',one,{once:true}); }
  });
  setTimeout(fin,12000);
}

const CELL=100, ITEM=128;                             // separación y tamaño de los juguetes del frente

function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function diff(){
  const L=level-1;
  return {
    types:  Math.min(PRODUCTS.length, 4+Math.floor(L/4)), // +1 juguete distinto cada 4 niveles
    depth:  Math.min(5, 2+Math.floor(L/8)),               // +1 capa en cola cada 8 niveles
    fill:   Math.min(0.9, 0.6+L*0.01),                    // menos espacios vacíos
    spread: Math.min(1, L*0.04),                          // iguales cada vez más separados
    helpWait: Math.max(0.25, 0.7-L*0.015),                // las vitrinas ayudan menos
    helpVis:  Math.max(0.35, 0.85-L*0.015)
  };
}
// Separa juguetes iguales que quedaron en la misma capa (k = 0..1)
function spread(trays,k){
  const tries=Math.round(trays.length*6*k);
  for(let n=0;n<tries;n++){
    const a=trays[rnd(trays.length)], i=rnd(3); if(a[i]===null) continue;
    const dup=a.some((v,j)=>j!==i&&v===a[i]); if(!dup) continue;
    const b=trays[rnd(trays.length)], j=rnd(3);
    if(b===a||b[j]===a[i]||b.some(v=>v===a[i])) continue;
    [a[i],b[j]]=[b[j],a[i]];
  }
}
function newLevel(){
  const D=diff();
  // filas de este nivel
  const pat=PATTERNS[rnd(PATTERNS.length)];
  let beltN=0;
  rows=pat.map((kind,r)=>{
    if(kind==='belt'){ const dir=(beltN++%2===0)?-1:1; return {kind,dir,off:Math.random()*BELT.step}; }
    return {kind, mask: r===2 ? MASKS[rnd(MASKS.length)] : [1,1,1]};
  });
  stations=[];
  rows.forEach((row,r)=>{
    if(row.kind==='fix') row.mask.forEach((m,k)=>{ if(m) stations.push({row:r,k,q:[],rise:0}); });
    else for(let k=0;k<BELT.n;k++) stations.push({row:r,k,q:[],rise:0});
  });
  // juguetes
  const cells=stations.length*D.depth*3;
  const triples=Math.round(cells*D.fill/3);
  const pool=shuffle([...PRODUCTS.keys()]).slice(0,D.types);   // juguetes distintos cada nivel
  let bag=[];
  for(let i=0;i<triples;i++){ const t=pool[i%D.types]; bag.push(t,t,t); }
  while(bag.length<cells) bag.push(null);
  shuffle(bag);
  const allTrays=[];
  stations.forEach(st=>{ for(let d=0;d<D.depth;d++) st.q.push([bag.pop(),bag.pop(),bag.pop()]); allTrays.push(...st.q); });
  spread(allTrays, D.spread);
  stations.forEach(st=>st.q=st.q.filter(tr=>tr.some(v=>v!==null))); // sin capas vacías
  total=triples*3; sorted=0; shownProg=0;
  slots=new Array(SLOT.n).fill(null); extraUsed=false; toast=null; history=[]; shuffleFx=0;
  locked=[false,false,true,true];
  targets=[null,null,null,null];
  flying=[]; fx=[];
  revives=0;
  state='play';
  for(let i=0;i<TGT.n;i++) if(!locked[i]) targets[i]=makeTarget(i);
  buildBg();
  hideAll();
  mus(gameSong());
  giftNew();
}

function remainingOf(t){
  let n=0;
  stations.forEach(st=>st.q.forEach(tr=>tr.forEach(v=>{if(v===t)n++;})));
  slots.forEach(s=>{if(s&&s.t===t)n++;});
  return n;
}
function makeTarget(i){
  const used=targets.filter((x,j)=>x&&j!==i).map(x=>x.t);
  const opts=[];
  for(let t=0;t<PRODUCTS.length;t++) if(!used.includes(t) && remainingOf(t)>0) opts.push(t);
  if(!opts.length) return null;
  const waiting=opts.filter(t=>slots.some(s=>s&&s.t===t));
  const visible=opts.filter(t=>stations.some(st=>st.q[0]&&st.q[0].includes(t)&&onScreen(st)));
  let t;
  const D=diff();
  if(waiting.length&&Math.random()<D.helpWait) t=waiting[rnd(waiting.length)];
  else if(visible.length&&Math.random()<D.helpVis) t=visible[rnd(visible.length)];
  else t=opts[rnd(opts.length)];
  return {t, fill:[false,false,false], landed:[false,false,false], pop:0};
}

// ---------- Posiciones ----------
function boxX(i){ return TGT.gap+i*(TGT.w+TGT.gap); }
function tgtPos(i,k){ return {x:boxX(i)+TGT.w*TGT_CELLS[k], y:TGT.y+TGT.h*0.52}; }
function slotX(i){ const n=slots.length, gap=(W-n*SLOT.w)/(n+1); return gap+i*(SLOT.w+gap); }
function boostX(i){ const n=BOOSTERS.length, w=n*BOOST.s+(n-1)*BOOST.gap; return (W-w)/2+i*(BOOST.s+BOOST.gap); }
function slotPos(i){ return {x:slotX(i)+SLOT.w/2, y:SLOT.y-SLOT_ITEM*0.40}; }
function rowTop(r){ return ROW.top+r*ROW.h; }
function rowBoard(r){ return rowTop(r)+ROW.h-42; }       // superficie donde se paran los juguetes
function stationX(st){
  const row=rows[st.row];
  if(row.kind==='fix') return FIX_W*st.k+FIX_W/2;
  let x=st.k*BELT.step+row.off;
  x=((x%BELT.loop)+BELT.loop)%BELT.loop;
  return x-BELT.step/2;
}
function onScreen(st){ const x=stationX(st); return x>-BELT.step/2+40 && x<W+BELT.step/2-40; }
function frontCell(st,j){ const cx=stationX(st), b=rowBoard(st.row); return {x:cx+(j-1)*CELL, y:b-ITEM*0.44, s:ITEM}; }
function backCell(st,j){ const cx=stationX(st), b=rowBoard(st.row); return {x:cx+(j-1)*CELL*BACK.dx, y:b-ITEM*0.44+BACK.dy, s:ITEM*BACK.sc}; }
// juguete del frente, con la animación de pasar de atrás hacia adelante
function liveCell(st,j){
  const f=frontCell(st,j); if(st.rise<=0) return f;
  const b=backCell(st,j), k=st.rise;
  return {x:f.x+(b.x-f.x)*k, y:f.y+(b.y-f.y)*k, s:f.s+(b.s-f.s)*k};
}

// ---------- Dibujo: madera ----------
function rr(c,x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); }
function grad(c,y0,y1,a,b){ const g=c.createLinearGradient(0,y0,0,y1); g.addColorStop(0,a); g.addColorStop(1,b); return g; }
let seed=7; function srand(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
function grain(c,x,y,w,h,alpha){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.strokeStyle='rgba(70,30,8,'+alpha+')'; c.lineWidth=2;
  for(let i=0;i<h/9;i++){
    const yy=y+srand()*h; c.beginPath(); c.moveTo(x,yy);
    for(let xx=x;xx<=x+w;xx+=60) c.lineTo(xx,yy+Math.sin(xx*0.01+i)*3*srand());
    c.stroke();
  }
  c.restore();
}
// tabla de estante: superficie + canto frontal + sombra abajo
function board(c,x,y,w,face){
  c.save();
  c.fillStyle='rgba(60,40,20,.18)'; rr(c,x+6,y+face,w-12,16,8); c.fill();   // sombra
  c.fillStyle=grad(c,y-12,y,'#f8d9a8','#f1c487'); rr(c,x,y-12,w,14,6); c.fill();
  c.fillStyle=grad(c,y,y+face,'#eab06b','#cf8a45'); rr(c,x,y,w,face,7); c.fill();
  c.fillStyle='rgba(255,255,255,.35)'; c.fillRect(x+8,y+2,w-16,3);
  c.restore();
}
// fondo estático: se dibuja una sola vez por nivel en un lienzo aparte (rendimiento)
const bg=document.createElement('canvas'); bg.width=W; bg.height=H;
function buildBg(){
  const c=bg.getContext('2d'); seed=11;
  // pared clara de los estantes
  c.fillStyle=grad(c,HEADER_H,H,'#ebe6de','#ddd5c9'); c.fillRect(0,HEADER_H,W,H-HEADER_H);

  c.save(); c.fillStyle='rgba(40,15,0,.25)'; c.fillRect(0,LEDGE_Y+30,W,22); c.restore();
  board(c,-10,LEDGE_Y+12,W+20,22);
  // borde inferior de la zona de arriba
  c.fillStyle='rgba(60,40,20,.22)'; c.fillRect(0,HEADER_H,W,18);
  c.fillStyle=grad(c,HEADER_H-24,HEADER_H,'#e8aa66','#c47a3a'); c.fillRect(0,HEADER_H-24,W,24);
  c.fillStyle='rgba(255,255,255,.3)'; c.fillRect(0,HEADER_H-24,W,3);
  // bases de espera
  for(let i=0;i<slots.length;i++){
    const x=slotX(i), y=SLOT.y;
    c.fillStyle='rgba(40,15,0,.3)'; rr(c,x+4,y+10,SLOT.w-8,SLOT.h,12); c.fill();
    c.fillStyle=grad(c,y+14,y+SLOT.h,'#e7a965','#c98444'); rr(c,x,y+10,SLOT.w,SLOT.h-10,12); c.fill();

  }

  rows.forEach((row,r)=>{
    if(row.kind!=='fix') return;
    const top=rowTop(r)+6, b=rowBoard(r);
    row.mask.forEach((m,k)=>{
      if(!m) return;
      const x=FIX_W*k+6, w=FIX_W-12;
      c.fillStyle='rgba(60,40,20,.16)'; rr(c,x+6,top+8,w,b-top+36,14); c.fill();          // sombra del mueble
      c.fillStyle=grad(c,top,b,'#d8cebf','#f3eee6'); c.fillRect(x+14,top+16,w-28,b-top-16); // fondo interior
      c.fillStyle=grad(c,top,top+20,'#f6cf9a','#e4a764'); rr(c,x,top,w,22,8); c.fill();     // tabla de arriba
      c.fillStyle=grad(c,top+16,top+40,'rgba(80,50,20,.22)','rgba(80,50,20,0)'); c.fillRect(x+14,top+20,w-28,22);
      c.fillStyle='#e8ab69'; rr(c,x,top,16,b-top+24,6); c.fill(); rr(c,x+w-16,top,16,b-top+24,6); c.fill(); // laterales
      c.fillStyle='rgba(255,255,255,.25)'; c.fillRect(x+3,top+6,3,b-top); c.fillRect(x+w-13,top+6,3,b-top);
      board(c,x,b,w,28);
    });
  });
  // banda de madera de los potenciadores
  c.fillStyle='rgba(60,40,20,.25)'; c.fillRect(0,BOOST.top-16,W,16);
  c.fillStyle=grad(c,BOOST.top,H,'#a95d30','#86411d'); c.fillRect(0,BOOST.top,W,H-BOOST.top);
  grain(c,0,BOOST.top,W,H-BOOST.top,0.10);
  c.fillStyle=grad(c,BOOST.top,BOOST.top+18,'#e8aa66','#c47a3a'); c.fillRect(0,BOOST.top,W,18);
  bgLevel=level;
}

// ---------- Dibujo: juguetes ----------
function drawProduct(t,x,y,size,mode,alpha){
  const p=PRODUCTS[t]; if(!p.im.complete||!p.im.naturalWidth) return;
  const src = mode==='dark' ? (p.dark||p.im) : mode==='ghost' ? (p.ghost||p.im) : p.im;
  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha*=alpha;
  if(mode==='dark'&&!p.dark) ctx.filter='brightness(0.25)';
  ctx.drawImage(src,x-size/2,y-size/2,size,size);
  ctx.restore();
}
function ready(name){ const i=IMG[name]; return i&&i.complete&&i.naturalWidth>0; }

function drawBox(i){
  const x=boxX(i), y=TGT.y, w=TGT.w, h=TGT.h, tg=targets[i], lock=locked[i];
  let s=1; if(tg&&tg.pop>0) s=1+0.12*Math.sin(tg.pop*Math.PI);
  ctx.save();
  ctx.translate(x+w/2,y+h/2); ctx.scale(s,s); ctx.translate(-(x+w/2),-(y+h/2));
  if(tg&&tg.pop>0) ctx.globalAlpha=1-tg.pop*0.6;
  // marco
  ctx.fillStyle='rgba(40,15,0,.3)'; rr(ctx,x+4,y+8,w,h,20); ctx.fill();
  ctx.fillStyle=grad(ctx,y,y+h,lock?'#c9c4bd':'#f0b879',lock?'#9b958d':'#c98140'); rr(ctx,x,y,w,h,20); ctx.fill();
  // interior
  const ix=x+12, iy=y+12, iw=w-24, ih=h-32;
  ctx.fillStyle=lock?grad(ctx,iy,iy+ih,'#6f6a64','#57534e'):grad(ctx,iy,iy+ih,'#7c4120','#a8622f'); rr(ctx,ix,iy,iw,ih,12); ctx.fill();
  if(!lock){
    ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=4;
    [1,2].forEach(k=>{ const xx=ix+iw*k/3; ctx.beginPath(); ctx.moveTo(xx,iy+6); ctx.lineTo(xx,iy+ih-6); ctx.stroke(); });
    if(tg) for(let k=0;k<3;k++){ const p=tgtPos(i,k); drawProduct(tg.t,p.x,p.y,BOX_ITEM, tg.landed[k]?'full':'ghost', tg.landed[k]?1:0.55); }
  } else {
    // botón verde "+"
    const cx=x+w/2, cy=iy+ih/2;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,32,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=grad(ctx,cy-27,cy+27,'#5fd54a','#2f9f2a'); ctx.beginPath(); ctx.arc(cx,cy,27,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; rr(ctx,cx-15,cy-5,30,10,4); ctx.fill(); rr(ctx,cx-5,cy-15,10,30,4); ctx.fill();
  }
  // brillo del vidrio
  ctx.fillStyle='rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.moveTo(ix,iy+ih*0.65); ctx.lineTo(ix+iw*0.45,iy); ctx.lineTo(ix+iw*0.62,iy); ctx.lineTo(ix,iy+ih); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function chip(x,y,w,h){ ctx.fillStyle='rgba(60,22,4,.55)'; rr(ctx,x,y,w,h,h/2); ctx.fill(); }
function drawBar(){
  ctx.save();
  ctx.textBaseline='middle';

  chip(28,BAR.y+8,290,72);
  const bx=40, by=BAR.y+14;
  ctx.fillStyle='#b8693a'; rr(ctx,bx+4,by+4,50,58,8); ctx.fill();

function drawStation(st){

  // fila de atrás (en sombra)
  const back=st.q[1];

    const a=st.rise>0?1-st.rise:1;
    back.forEach((t,j)=>{ if(t!==null){ const p=backCell(st,j); drawProduct(t,p.x,p.y,p.s,'dark',a); } });
  }
  // fila del frente
  const front=st.q[0];
  if(front) front.forEach((t,j)=>{
    if(t===null||front.hide===j) return;
    const p=liveCell(st,j); if(shuffleFx>0) p.s*=1-0.35*Math.sin(Math.PI*shuffleFx);

// ---------- Efecto de caja completa: confeti, destellos y aro de luz ----------
let fx=[], boxCombo=0, lastBoxAt=0;
const CONFETTI=['#ff5c8a','#ffb547','#4cc46a','#3b8fe0','#9a5ad8','#ffd84d'];
function burst(i){
  const cx=boxX(i)+TGT.w/2, cy=TGT.y+TGT.h/2;
  fx.push({type:'ring',x:cx,y:cy,t:0,life:0.55});
  fx.push({type:'glow',i,t:0,life:0.6});
  for(let n=0;n<56;n++){
    const a=Math.random()*Math.PI*2, v=450+Math.random()*750;
    fx.push({type:'conf',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-420,r:Math.random()*6,vr:(Math.random()-.5)*14,
             w:18+Math.random()*16,h:10+Math.random()*9,c:CONFETTI[n%CONFETTI.length],t:0,life:1.1+Math.random()*0.5});
  }
  for(let n=0;n<12;n++){
    const a=n/12*Math.PI*2;
    fx.push({type:'star',x:cx,y:cy,vx:Math.cos(a)*700,vy:Math.sin(a)*700,t:0,life:0.8});
  }
  fx.push({type:'text',x:cx,y:TGT.y+TGT.h+40,t:0,life:0.9,msg:boxCombo>1?'x'+boxCombo+'!':'+3'});
}
function updateFx(dt){
  for(let k=fx.length-1;k>=0;k--){
    const f=fx[k]; f.t+=dt; if(f.t>=f.life){ fx.splice(k,1); continue; }
    if(f.type==='conf'){ f.vy+=1500*dt; f.vx*=0.985; f.x+=f.vx*dt; f.y+=f.vy*dt; f.r+=f.vr*dt; }
    else if(f.type==='star'){ f.vx*=0.9; f.vy*=0.9; f.x+=f.vx*dt; f.y+=f.vy*dt; }
  }
}
function starPath(x,y,r){ ctx.beginPath(); for(let n=0;n<10;n++){ const a=-Math.PI/2+n*Math.PI/5, rr2=n%2?r*0.45:r; ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } ctx.closePath(); }
function drawFx(){
  for(const f of fx){
    const k=f.t/f.life;
    ctx.save();
    if(f.type==='ring'){ ctx.globalAlpha=1-k; ctx.strokeStyle='#fff6b0'; ctx.lineWidth=26*(1-k)+3; ctx.beginPath(); ctx.arc(f.x,f.y,50+k*300,0,Math.PI*2); ctx.stroke(); }
    else if(f.type==='glow'){ const x=boxX(f.i),y=TGT.y; ctx.globalAlpha=0.7*(1-k); ctx.fillStyle='#fffbe0'; rr(ctx,x-8,y-8,TGT.w+16,TGT.h+16,24); ctx.fill(); }
    else if(f.type==='conf'){ ctx.globalAlpha=Math.min(1,(1-k)*2); ctx.translate(f.x,f.y); ctx.rotate(f.r); ctx.fillStyle=f.c; ctx.fillRect(-f.w/2,-f.h/2,f.w,f.h); }
    else if(f.type==='star'){ ctx.globalAlpha=1-k; ctx.fillStyle='#ffe066'; starPath(f.x,f.y,34*(1-k*0.4)); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.stroke(); ctx.fill(); }
    else if(f.type==='text'){ ctx.globalAlpha=Math.min(1,(1-k)*2); ctx.font='700 80px Fredoka,system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const y=f.y-k*60; ctx.lineWidth=10; ctx.strokeStyle='#8e0f42'; ctx.strokeText(f.msg,f.x,y); ctx.fillStyle='#fff'; ctx.fillText(f.msg,f.x,y); }
    ctx.restore();
  }
}

// ---------- Lógica ----------
function fly(t,from,to,s0,s1,done){ flying.push({t,x0:from.x,y0:from.y,x1:to.x,y1:to.y,s0,s1,k:0,done}); }

function sendToTarget(t,from,s0){
  for(let i=0;i<TGT.n;i++){
    const tg=targets[i]; if(locked[i]||!tg||tg.t!==t||tg.pop>0) continue;
    const k=tg.fill.indexOf(false); if(k<0) continue;
    tg.fill[k]=true;
    snd('up',{k});                                   // sonido de subida hacia la caja
    fly(t,from,tgtPos(i,k),s0,BOX_ITEM,()=>{ tg.landed[k]=true; sorted++; snd('place',{k});
      if(tg.landed.every(Boolean)){ tg.pop=0.001; boxCombo=(performance.now()-lastBoxAt<2500)?boxCombo+1:1; lastBoxAt=performance.now();
        snd('box',{combo:boxCombo}); burst(i); } });
    return true;
  }
  return false;
}
function sendToSlot(t,from,s0){
  const i=slots.indexOf(null); if(i<0) return false;
  const s={t,landed:false}; slots[i]=s;
  fly(t,from,slotPos(i),s0,SLOT_ITEM,()=>{ s.landed=true; snd('slot'); pullFromSlots();
    if(state==='play'&&slots.filter(Boolean).length===slots.length-1) setTimeout(()=>snd('warn'),120); }); // si ya hay vitrina que calce, sube de una vez
  return s;
}
function fits(t){ return targets.some((tg,i)=>!locked[i]&&tg&&tg.t===t&&tg.pop===0&&tg.fill.includes(false)); }
function checkLose(){
  if(state!=='play'||flying.length) return;
  if(!slots.every(s=>s&&s.landed)) return;
  if(targets.some(tg=>tg&&tg.pop>0)) return;
  const canSlot=slots.some(s=>fits(s.t));
  const canTray=stations.some(st=>st.rise===0&&st.q[0]&&st.q[0].some(t=>t!==null&&fits(t)));
  if(!canSlot&&!canTray){ state='lose'; mus(null); snd('lose'); showLose(); }
}
// Revivir: los juguetes de la espera vuelven a los estantes (no se pierden, el nivel sigue completable)
function revive(){
  const items=slots.filter(Boolean).map(s=>s.t);
  const starts=slots.map((s,i)=>s?slotPos(i):null).filter(Boolean);
  slots=new Array(slots.length).fill(null);
  const trays=[]; for(let i=0;i<items.length;i+=3){ const tr=items.slice(i,i+3); while(tr.length<3) tr.push(null); trays.push(shuffle(tr)); }
  trays.forEach(tr=>{
    const minQ=Math.min(...stations.map(st=>st.q.length));
    const pick=stations.filter(st=>st.q.length===minQ);
    const st=pick[rnd(pick.length)];
    if(!st.q.length) st.rise=1;                     // estante vacío: la capa aparece desde atrás
    st.q.push(tr);
  });
  starts.forEach((p,i)=>fly(items[i],p,{x:p.x,y:H+150},SLOT_ITEM,90,()=>{}));
  revives++;
  state='play'; hideAll(); snd('boost'); mus(gameSong());
}
function showLose(){
  const left=MAX_REVIVES-revives, can=left>0;
  $('overText').textContent=can?T.loseRevive:T.loseText;
  $('overAd').hidden=!can; $('overPay').hidden=!can; $('overLeft').hidden=!can;
  $('overPay').disabled=coins<REVIVE_COST;
  $('overPayCost').textContent=REVIVE_COST;
  $('overLeft').textContent=coins<REVIVE_COST?T.noCoins+' · '+T.revLeft(left):T.revLeft(left);
  $('overRetry').className='btn '+(can?'ghosty':'primary');
  show('over');
}
function showWin(){
  winGain=coinsFor(level-1); winDoubled=false;
  addCoins(winGain);
  mus(null); snd('win'); setTimeout(()=>snd('coin'),900);
  $('winText').textContent=T.winText(level-1);
  $('winCoins').textContent='+'+winGain;
  $('winDouble').hidden=false; $('winDouble').disabled=false;
  show('win');
}
function pullFromSlots(){
  slots.forEach((s,i)=>{
    if(!s||!s.landed) return;
    if(sendToTarget(s.t,slotPos(i),SLOT_ITEM)) slots[i]=null;
  });
}
// Revisión de respaldo (cada cuadro): evita niveles imposibles
function backupCheck(){
  if(state!=='play') return;
  targets.forEach((tg,i)=>{ if(!tg&&!locked[i]){ const n=makeTarget(i); if(n) targets[i]=n; } });
  targets.forEach((tg,i)=>{
    if(!tg||tg.pop>0) return;
    const free=tg.fill.filter(f=>!f).length;
    if(free===3 && remainingOf(tg.t)<3){ targets[i]=makeTarget(i); }   // solo si aún está vacía
  });
  pullFromSlots();
}
function checkWin(){
  if(state!=='play') return;
  const left=stations.some(st=>st.q.length) || slots.some(Boolean) || flying.length;
  if(!left && targets.every(t=>!t||t.pop===0)){
    state='win'; level++; try{localStorage.setItem('skewer_level',level);}catch(e){}
    showWin();
  }
}
function checkEmpty(st){
  if(st.q[0] && st.q[0].every(v=>v===null)){
    st.q.shift();
    if(st.q.length) st.rise=1;                       // la capa de atrás pasa adelante
  }
}
function unlockBox(i){
  if(!locked[i]||(window.Ads&&Ads.busy)) return;
  rewarded('unlock',()=>{ if(!locked[i]||state==='menu') return; locked[i]=false; targets[i]=makeTarget(i); snd('unlock'); pullFromSlots(); });
}
// ---------- Potenciadores ----------
// Quita un juguete de un estante (cualquier capa) y limpia capas vacías
function takeFrom(st,tr,j){
  tr[j]=null;
  if(tr===st.q[0]) checkEmpty(st);
  else if(tr.every(v=>v===null)) st.q.splice(st.q.indexOf(tr),1);
}
function canUse(id){
  if(id==='slot') return !extraUsed;
  if(id==='magnet') return targets.some((tg,i)=>!locked[i]&&tg&&tg.pop===0&&tg.fill.includes(false)&&remainingOf(tg.t)>=tg.fill.filter(f=>!f).length);
  if(id==='undo') return history.some(h=>slots.includes(h.slot)&&h.slot.landed);
  if(id==='shuffle') return stations.filter(st=>st.q[0]&&st.rise===0).reduce((n,st)=>n+st.q[0].filter(v=>v!==null).length,0)>1;
  return false;
}
function applyBooster(id){
  snd(id==='slot'?'unlock':id);
  if(id==='slot'){ extraUsed=true; slots.push(null); buildBg(); pullFromSlots(); }
  else if(id==='magnet'){
    // la vitrina más avanzada: sube los juguetes que le faltan (primero de la espera, luego del frente, luego de atrás)
    const i=targets.map((tg,k)=>k).filter(k=>{ const tg=targets[k]; return !locked[k]&&tg&&tg.pop===0&&tg.fill.includes(false)&&remainingOf(tg.t)>=tg.fill.filter(f=>!f).length; })
      .sort((a,b)=>targets[b].fill.filter(Boolean).length-targets[a].fill.filter(Boolean).length)[0];
    const t=targets[i].t; let need=targets[i].fill.filter(f=>!f).length;
    slots.forEach((s,k)=>{ if(need>0&&s&&s.landed&&s.t===t&&sendToTarget(t,slotPos(k),SLOT_ITEM)){ slots[k]=null; need--; } });
    for(let layer=0;layer<6&&need>0;layer++) for(const st of stations){
      const tr=st.q[layer]; if(!tr) continue;
      for(let j=0;j<3&&need>0;j++) if(tr[j]===t){
        const c=layer===0?frontCell(st,j):backCell(st,j);
        const from={x:Math.max(40,Math.min(W-40,c.x)),y:c.y};
        if(sendToTarget(t,from,c.s)){ takeFrom(st,tr,j); need--; }
      }
    }
  }
  else if(id==='undo'){
    // devuelve a su estante el último juguete que fue a la espera
    let h; while(history.length){ h=history.pop(); if(slots.includes(h.slot)&&h.slot.landed) break; h=null; }
    if(!h) return;
    const k=slots.indexOf(h.slot), st=h.st, t=h.slot.t; slots[k]=null;
    // si su capa sigue al frente vuelve a su hueco; si no, entra una capa nueva al frente
    let tr=(st.q[0]===h.tr&&h.tr[h.j]===null)?h.tr:null;
    if(!tr){ tr=[null,null,null]; st.q.unshift(tr); }
    st.rise=0; tr[h.j]=t; tr.hide=h.j;                 // oculto mientras vuela de regreso
    const c=frontCell(st,h.j);
    fly(t,slotPos(k),{x:Math.max(40,Math.min(W-40,c.x)),y:c.y},SLOT_ITEM,ITEM,()=>{ tr.hide=undefined; });
  }
  else if(id==='shuffle'){
    // mezcla los juguetes del frente de todos los estantes (los huecos quedan donde estaban)
    const cells=[];
    stations.forEach(st=>{ if(st.q[0]&&st.rise===0) st.q[0].forEach((v,j)=>{ if(v!==null) cells.push([st.q[0],j]); }); });
    const vals=shuffle(cells.map(([tr,j])=>tr[j]));
    cells.forEach(([tr,j],k)=>tr[j]=vals[k]);
    shuffleFx=1;
  }
}
function useBooster(i){
  const b=BOOSTERS[i];
  if(level<b.lv||state!=='play') return;
  if(b.id==='slot'&&extraUsed){ toast={msg:T.slotFull,t:1.6}; return; }
  if(!canUse(b.id)){ toast={msg:T.noUse,t:1.6}; return; }
  if((inv.n[b.id]||0)>0){ inv.n[b.id]--; saveInv(); applyBooster(b.id); return; }
  if(window.Ads&&Ads.busy) return;
  rewarded('boost_'+b.id,()=>{ if(state==='play'&&canUse(b.id)) applyBooster(b.id); });   // con anuncio se usa de una vez
}
const inRect=(x,y,a,b,w,h)=>x>=a&&x<=a+w&&y>=b&&y<=b+h;
function tap(x,y){
  if(state!=='play') return;
  if(inRect(x,y,PAUSE.x-10,PAUSE.y-10,PAUSE.w+20,PAUSE.h+20)){ state='pause'; show('pause'); return; }
  for(let i=0;i<TGT.n;i++) if(locked[i]&&inRect(x,y,boxX(i),TGT.y,TGT.w,TGT.h)){ unlockBox(i); return; }
  for(let i=0;i<BOOSTERS.length;i++) if(inRect(x,y,boostX(i),BOOST.y,BOOST.s,BOOST.s)){ useBooster(i); return; }
  if(y<HEADER_H||y>BOOST.top) return;
  for(const st of stations){
    if(!st.q[0]||st.rise>0) continue;
    for(let j=0;j<3;j++){
      const t=st.q[0][j]; if(t===null||st.q[0].hide===j) continue;
      const p=frontCell(st,j);
      if(p.x<0||p.x>W) continue;
      if(Math.abs(p.x-x)<CELL/2 && y>p.y-ITEM*0.5 && y<rowBoard(st.row)+20){
        const tr=st.q[0];
        if(sendToTarget(t,p,ITEM)){ tr[j]=null; checkEmpty(st); }
        else{ const sl=sendToSlot(t,p,ITEM); if(sl){ snd('pick'); history.push({slot:sl,st,tr,j}); tr[j]=null; checkEmpty(st); } }
        return;
      }
    }
  }
}

cv.addEventListener('pointerdown',e=>{
  // El lienzo usa object-fit:contain: en pantallas más alargadas que 9:16 (casi todos los teléfonos)
  // el dibujo queda centrado con franjas arriba/abajo, así que hay que descontarlas.
  const r=cv.getBoundingClientRect();
  const k=Math.min(r.width/W, r.height/H);
  const ox=(r.width-W*k)/2, oy=(r.height-H*k)/2;
  tap((e.clientX-r.left-ox)/k,(e.clientY-r.top-oy)/k);
});

// ---------- Overlay ----------
const $=id=>document.getElementById(id);
let assetsReady=false;
function hideAll(){ ['home','win','over','pause','settings','credits'].forEach(id=>$(id).hidden=true); }
function show(id){ hideAll(); $(id).hidden=false; }
function goMenu(){ state='menu'; renderHome(); show('home'); mus('menu'); }
function renderHome(){
  $('playTitle').textContent=level>1?T.continueT:T.play;
  $('playLabel').textContent=assetsReady?T.level+' '+level:T.loading;
  // potenciadores: usos que quedan, o el nivel en que se abren
  $('boostPips').innerHTML=BOOSTERS.map(b=>{
    const open=level>=b.lv, n=inv.n[b.id]||0;
    return '<span class="boost-pip'+(open?'':' locked')+'">'+T.boostNames[b.id]+' · '+(open?n:'🔒 '+T.lv+b.lv)+'</span>';
  }).join('');
  updateCoinUI();
}
// Ajustes y Créditos se abren encima de la portada o de la pausa
function openSettings(){ $('privacyBtn').hidden=!(window.Ads&&Ads.privacyRequired&&Ads.privacyRequired()); $('settings').hidden=false; }
function closeSettings(){ $('settings').hidden=true; }
function openCredits(){ $('credits').hidden=false; }
function closeCredits(){ $('credits').hidden=true; }
// Pantalla completa solo entre niveles (nunca a mitad de nivel). Si acaba de ver un anuncio con recompensa, se salta esta vez.
function nextLevel(){
  const done=level-1;
  adCount++; try{localStorage.setItem('toysort_adcount',adCount);}catch(e){}
  if(done>=AD_FROM_LEVEL && adCount>=AD_EVERY && !winDoubled){
    adCount=0; try{localStorage.setItem('toysort_adcount',0);}catch(e){}
    window.Ads ? Ads.showInterstitial(newLevel) : newLevel();
  } else newLevel();
}
function rewarded(placement,onOk){ if(window.Ads) Ads.showRewarded(placement,onOk,()=>{}); else onOk(); }
// Android: botón atrás (true = lo manejó el juego; false = Android pregunta si salir) y app en segundo plano
window.__androidBack=()=>{
  if(!$('credits').hidden){ closeCredits(); return true; }
  if(!$('settings').hidden){ closeSettings(); return true; }
  if(state==='play'){ state='pause'; show('pause'); return true; }
  if(state==='pause'){ state='play'; hideAll(); return true; }
  if(state==='win'||state==='lose'){ goMenu(); return true; }
  return false;
};
window.__androidPause=()=>{ if(state==='play'){ state='pause'; show('pause'); } };
// las filas se detienen mientras se ve un anuncio
if(window.Ads){ Ads.onPause=()=>{adPaused=true;}; Ads.onResume=()=>{adPaused=false;}; }
// textos (se vuelven a poner al cambiar el idioma en Ajustes)
function applyTexts(){
document.documentElement.lang=LANG;
$('tagline').textContent=T.tagline; $('playZone').textContent=T.zone; $('playSub').textContent=T.sub;
$('boostZone').textContent=T.boostZone; $('boostTitle').textContent=T.boostTitle; $('homeSettings').setAttribute('aria-label',T.settings);
$('settingsTitle').textContent=T.settings; $('languageName').textContent=T.language; $('langName').textContent=T.langName;
$('privacyName').textContent=T.privacy; $('creditsName').textContent=T.credits; $('settingsClose').textContent=T.close; $('pauseSettings').textContent=T.settings;
$('creditsTitle').textContent=T.credits; $('versionWord').textContent=T.version; $('creditsClose').textContent=T.close;
['cMadeBy','cDev','cFont','cThanks','cThanksText','cContact','cRights','cMusic','cMusicText','cSfx'].forEach(k=>$(k).textContent=T[k]);
$('musicName').textContent=T.music; $('sfxName').textContent=T.sfx; renderSound();
$('winTitle').textContent=T.win; $('winNextLabel').textContent=T.next; $('winMenu').textContent=T.menu;
$('overTitle').textContent=T.lose; $('overText').textContent=T.loseText; $('overRetry').textContent=T.retry; $('overMenu').textContent=T.menu;
$('winDoubleLabel').textContent=T.double; $('overAdLabel').textContent=T.reviveAd; $('overPayLabel').textContent=T.revivePay;
$('pauseTitle').textContent=T.pause; $('pauseGoLabel').textContent=T.resume; $('pauseRetry').textContent=T.retry; $('pauseMenu').textContent=T.menu;
if(state==='menu') renderHome();
}
applyTexts();
// versión de la app (Android la da; en la web dice "web")
try{ $('appVersion').textContent=(window.AndroidApp&&AndroidApp.version)?AndroidApp.version():'web'; }catch(e){ $('appVersion').textContent='web'; }
$('winToys').innerHTML=['osito','unicornio','robot'].map(n=>'<img src="assets/'+n+'.png" alt="">').join('');
// botones
$('playBtn').onclick=()=>{ if(assetsReady) newLevel(); };
$('winNext').onclick=nextLevel; $('overRetry').onclick=newLevel; $('pauseRetry').onclick=newLevel;
$('winMenu').onclick=goMenu; $('overMenu').onclick=goMenu; $('pauseMenu').onclick=goMenu;
$('homeSettings').onclick=openSettings; $('pauseSettings').onclick=openSettings;
$('settingsClose').onclick=closeSettings; $('creditsBtn').onclick=openCredits; $('creditsClose').onclick=closeCredits;
$('settings').onclick=e=>{ if(e.target===$('settings')) closeSettings(); };
$('credits').onclick=e=>{ if(e.target===$('credits')) closeCredits(); };
$('privacyBtn').onclick=()=>{ if(window.Ads&&Ads.showPrivacy) Ads.showPrivacy(); };
window.__adsPrivacyChanged=()=>{ $('privacyBtn').hidden=!(window.Ads&&Ads.privacyRequired&&Ads.privacyRequired()); };
function renderSound(){
  const st=(window.Sound&&Sound.settings)||{music:true,sfx:true};
  $('musicToggle').classList.toggle('off',!st.music); $('musicToggle').setAttribute('aria-pressed',st.music);
  $('sfxToggle').classList.toggle('off',!st.sfx); $('sfxToggle').setAttribute('aria-pressed',st.sfx);
}
$('musicToggle').onclick=()=>{ if(window.Sound){ Sound.setMusic(!Sound.settings.music); renderSound(); } };
$('sfxToggle').onclick=()=>{ if(window.Sound){ Sound.setSfx(!Sound.settings.sfx); renderSound(); snd('click'); } };
// sonido de botones
document.addEventListener('click',e=>{ if(e.target.closest('.btn,.mode-card,.gear-btn,#langToggle,#creditsBtn,#privacyBtn')) snd('click'); },true);
$('langToggle').onclick=()=>{
  LANG=LANG==='en'?'es':'en'; T=TEXTS[LANG];
  try{ localStorage.setItem('toysort_lang',LANG); }catch(e){}
  applyTexts();
};
$('pauseGo').onclick=()=>{ if(state==='pause'){ state='play'; hideAll(); } };
$('winDouble').onclick=()=>rewarded('double',()=>{
  if(winDoubled) return;
  winDoubled=true; addCoins(winGain); snd('coin');
  $('winCoins').textContent='+'+(winGain*2)+' · '+T.doubled;
  const r=$('winReward'); r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop');
  $('winDouble').hidden=true;
});
$('overAd').onclick=()=>{ if(state==='lose'&&revives<MAX_REVIVES) rewarded('revive',()=>{ if(state==='lose') revive(); }); };
$('overPay').onclick=()=>{ if(state==='lose'&&revives<MAX_REVIVES&&spendCoins(REVIVE_COST)) revive(); };
updateCoinUI();

// ---------- Bucle ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play'&&!adPaused) rows.forEach(r=>{ if(r.kind==='belt') r.off+=r.dir*SPEED*dt; });
  shownCoins+=(coins-shownCoins)*Math.min(1,dt*8); if(Math.abs(coins-shownCoins)<0.5) shownCoins=coins;
  const prog=total?sorted/total:0; shownProg+=(prog-shownProg)*Math.min(1,dt*6);
  if(toast) toast.t-=dt;
  updateFx(dt);
  if(shuffleFx>0) shuffleFx=Math.max(0,shuffleFx-dt/0.35);
  stations.forEach(st=>{ if(st.rise>0) st.rise=Math.max(0,st.rise-dt/RISE_TIME); });
  for(let i=flying.length-1;i>=0;i--){ const f=flying[i]; f.k+=dt/0.32; if(f.k>=1){ flying.splice(i,1); f.done(); } }
  targets.forEach((tg,i)=>{
    if(tg&&tg.pop>0){ tg.pop+=dt/0.4; if(tg.pop>=1){ targets[i]=makeTarget(i); pullFromSlots(); } } // vitrina nueva: revisar espera
  });
  backupCheck();
  checkLose(); checkWin();
  draw();
  requestAnimationFrame(loop);
}
newLevel(); goMenu();
const SPLASH_MIN_MS=3000;
function closeSplash(){
  const el=$('splash'); if(!el) return;
  const wait=Math.max(0,SPLASH_MIN_MS-(Date.now()-(window.__splashStart||0)));
  setTimeout(()=>{
    const done=()=>{ if(el.parentNode) el.remove(); };
    el.addEventListener('animationend',e=>{ if(e.target===el) done(); });
    el.classList.add('leaving'); setTimeout(done,600);
  },wait);
}
whenReady(()=>{ assetsReady=true; $('playBtn').disabled=false; if(state==='menu') renderHome(); closeSplash(); });
requestAnimationFrame(loop);
</script>
